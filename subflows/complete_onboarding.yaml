appId: org.wikipedia
---
# First-run onboarding is 4 pages. Pages 1-3 only have a "Forward" arrow;
# the last page swaps it for "Skip" / "Next".
- assertVisible: "All the world's knowledge"
- tapOn: "Forward"

- assertVisible: "Data & Privacy"
- tapOn: "Forward"

- assertVisible: "Read in more than 300 languages"
- tapOn: "Forward"

- assertVisible: "Follow your curiosity"
- tapOn: "Skip"

- extendedWaitUntil:
    visible:
      id: "org.wikipedia:id/nav_tab_home"
    timeout: 30000
