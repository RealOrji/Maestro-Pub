name: Maestro E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pin the app build so a new Wikipedia release can't silently break the suite.
  WIKIPEDIA_APK_URL: https://releases.wikimedia.org/mobile/android/wikipedia/stable/wikipedia-50614-r-2026-10-20.apk

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download Wikipedia APK
        run: curl -sSL -o wikipedia.apk "$WIKIPEDIA_APK_URL"

      - name: Run Maestro suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r wikipedia.apk
            maestro test . --format junit --output report.xml --test-output-dir debug-output

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            report.xml
            debug-output/
